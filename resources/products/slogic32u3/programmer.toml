# SLogic32U3 外置烧录器声明（公开，入库）
#
# 绝大多数字段（cli / cable_candidates / [programmer.flash] / [programmer.efuse]）都在
# 共享 resources/programmer.toml 里给了默认值——**这里通常只需声明 device 与 idcode**
# （各产品不同：device 必填、无默认，IDCODE 须精确匹配；idcode 供 JTAG 工位自动识别产品）。
# 需要时才在本文件按同名键覆盖默认（cable_candidates 整体覆盖；flash/efuse 按键合并）。
schema_version = 1

[programmer]
device = "GW5AT-60B"               # SLogic32U3 = Gowin GW5AT-60B（IDCODE 0x0001481B）
idcode = 0x0001481B                # JTAG 工位按此自动识别产品（读到的 IDCODE == 本值 -> 32U3）

# --- 可选覆盖（默认见 resources/programmer.toml）---
# cable_candidates = [5, 4, 1]     # 本机 FTDI 枚举为 WINUSB=5；默认 [5, 4, 1, 0] 也能探到
# [programmer.flash]
# image = "firmware/dfu.bin"       # 默认 glob firmware/dfu.*，通常无需指定
